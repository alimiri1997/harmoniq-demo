<script>
(()=>{
'use strict';
const QS=new URLSearchParams(location.search), initialView=QS.get('view')||'studio';
const KEY='harmoniq-demo-multievent-v1', CHANNEL='harmoniq-demo-multievent-v1';
const COLORS={violet:'#7851e9',pink:'#e45fc2',teal:'#34c9b0',gold:'#fac779',blue:'#5c80ff'};
const sequence=[{at:0,label:'Violet pulse',color:COLORS.violet},{at:4,label:'Pink wave',color:COLORS.pink},{at:8,label:'Ocean glow',color:COLORS.teal},{at:12,label:'Finale',color:COLORS.gold}];
const baseline={activeTab:'overview',view:'studio',eventName:'MIDNIGHT FESTIVAL',attendees:86,color:COLORS.violet,lightMode:'idle',lightStarted:0,lightName:'Aurora Wave',poll:{question:'Which track should play next?',options:['Euphoria','Afterglow','The Final Beat'],votes:[13,8,3],open:false,version:1},quiz:{question:'What colour comes next in the Aurora Wave?',options:['Electric blue','Violet','Amber'],correct:1,open:false,version:1},announcement:'The next light moment starts in 2 minutes. Keep this page open to join the wave.',announcementSent:false,sponsorActive:false,rewardCount:18,lightLaunchCount:0,updated:Date.now()};
function clone(x){return JSON.parse(JSON.stringify(x))}
function newEventState(name,seed=false){
 const b=clone(baseline);b.eventName=name.toUpperCase();
 if(!seed){b.attendees=0;b.poll.votes=[0,0,0];b.poll.open=false;b.rewardCount=0;b.lightLaunchCount=0;}
 b.updated=Date.now();return b;
}
function seededDatabase(){
 const first=newEventState('Midnight Festival',true);
 try{const legacy=JSON.parse(localStorage.getItem('harmoniq-demo-state-v3')||'null');if(legacy?.poll&&legacy?.quiz)Object.assign(first,legacy)}catch(e){}
 const second=newEventState('City Beats Live');second.poll.question='Which act should play next?';second.poll.options=['Neon Echo','Northern Lights','Echo Pulse'];second.quiz.question='Which city hosts this demo event?';second.quiz.options=['Manchester','Bristol','London'];second.quiz.correct=0;
 return {version:1,events:[{id:'evt-midnight',code:'NIGHT26',name:'Midnight Festival',venue:'London · O2-inspired demo venue',date:'2026-11-14',status:'live',category:'Concert',state:first},{id:'evt-citybeats',code:'BEATS26',name:'City Beats Live',venue:'Manchester · Demo Arena',date:'2026-11-28',status:'live',category:'Music Festival',state:second}]};
}
function readDatabase(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.events)&&d.events.length&&d.events.every(x=>x.state?.poll&&x.state?.quiz))return d;}catch(e){}return seededDatabase();}
let db=readDatabase(),view=initialView,tab='overview',audiencePage='home',stageMode='welcome',editingEventId=null;
function findEvent(ref){return db.events.find(e=>e.id===ref||e.code===String(ref||'').toUpperCase())||null;}
let organiserEventId=sessionStorage.getItem('hm-organiser-event')||db.events[0].id;
let attendeeEventId=sessionStorage.getItem('hm-attendee-event')||null;
let displayEventId=QS.get('event')||sessionStorage.getItem('hm-display-event')||organiserEventId;
let joined=Boolean(attendeeEventId&&sessionStorage.getItem('hm-joined-current')===attendeeEventId);
let event=chooseEvent(),state=event.state;
function chooseEvent(){const id=view==='attendee'?(attendeeEventId||QS.get('event')||organiserEventId):view==='display'?displayEventId:organiserEventId;return findEvent(id)||db.events[0];}
function refreshActive(){event=chooseEvent();state=event.state;joined=Boolean(attendeeEventId&&sessionStorage.getItem('hm-joined-current')===attendeeEventId);}
const sessionId=(()=>{let id=sessionStorage.getItem('harmoniq-session-id');if(!id){id='d-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e7).toString(36);sessionStorage.setItem('harmoniq-session-id',id)}return id})();
let bc;try{bc=new BroadcastChannel(CHANNEL);bc.onmessage=()=>refreshFromStorage()}catch(e){}
window.addEventListener('storage',e=>{if(e.key===KEY)refreshFromStorage()});
function refreshFromStorage(){db=readDatabase();refreshActive();draw()}
function updateDatabase(fn){const next=readDatabase();fn(next);db=next;try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){}try{bc?.postMessage({type:'changed'})}catch(e){}refreshActive();draw()}
function update(fn){const id=event.id;updateDatabase(d=>{const selected=d.events.find(e=>e.id===id);if(selected){fn(selected.state);selected.state.updated=Date.now();}})}
function selectOrganiser(id){if(!findEvent(id))return;organiserEventId=id;sessionStorage.setItem('hm-organiser-event',id);editingEventId=null;audiencePage='home';stageMode='welcome';refreshActive();draw();}
function selectDisplay(id){if(!findEvent(id))return;displayEventId=id;sessionStorage.setItem('hm-display-event',id);stageMode='welcome';refreshActive();draw();}
function joinEventByCode(code){const found=findEvent(String(code||'').trim().toUpperCase());if(!found){toast('Event not found. Check the code and try again.');return false;}
 if(found.status!=='live'){toast('This event is not open for attendees.');return false;}
 const previous=sessionStorage.getItem('hm-joined-current');
 updateDatabase(d=>{if(previous&&previous!==found.id){const old=d.events.find(e=>e.id===previous);if(old)old.state.attendees=Math.max(0,old.state.attendees-1)}if(previous!==found.id){const next=d.events.find(e=>e.id===found.id);if(next)next.state.attendees++;}});
 attendeeEventId=found.id;sessionStorage.setItem('hm-attendee-event',found.id);sessionStorage.setItem('hm-joined-current',found.id);
 audiencePage='home';view='attendee';refreshActive();draw();toast('Joined '+found.name+'!');return true;
}
function leaveEvent(){const prev=sessionStorage.getItem('hm-joined-current');if(prev)updateDatabase(d=>{const old=d.events.find(e=>e.id===prev);if(old)old.state.attendees=Math.max(0,old.state.attendees-1)});sessionStorage.removeItem('hm-joined-current');sessionStorage.removeItem('hm-attendee-event');attendeeEventId=null;joined=false;audiencePage='home';refreshActive();draw();}
function eventsManagement(){const list=db.events.map(e=>`<article class="event-card ${e.id===organiserEventId?'focused':''}"><div class="event-meta"><span class="event-status ${esc(e.status)}">${e.status.toUpperCase()}</span><span class="event-code">${esc(e.code)}</span></div><h3>${esc(e.name)}</h3><p>${esc(e.venue||'No venue selected')} · ${esc(e.date||'Date TBC')}</p><div class="event-kpis">${e.state.attendees} demo attendees · ${e.state.poll.votes.reduce((a,b)=>a+b,0)} poll votes · ${e.state.lightLaunchCount} light shows</div><div class="event-actions"><button class="btn ${e.id===organiserEventId?'secondary':''}" data-select-event="${esc(e.id)}">${e.id===organiserEventId?'✓ Selected':'Manage event →'}</button><button class="btn ghost" data-edit-event="${esc(e.id)}">Edit</button><button class="btn ghost" data-toggle-event="${esc(e.id)}">${e.status==='live'?'Pause entry':'Open entry'}</button></div></article>`).join('');
 const edit=db.events.find(e=>e.id===editingEventId);return `${heading('EVENT MANAGEMENT / MULTI EVENT','Your events','Create separate event spaces, each with its own joining code, lighting, polls and analytics.')}<div class="grid-3" style="margin-bottom:19px">${stat(db.events.length,'Events created','Independent event profiles')}${stat(db.events.filter(e=>e.status==='live').length,'Open for entry','Attendees can join')}${stat(db.events.reduce((a,e)=>a+e.state.attendees,0),'Demo attendees','Across all events')}</div><div class="panel"><h2>Manage your events</h2><p class="descr">Select an event to control it. Changing event does not change other events' data.</p><div class="event-list">${list}</div></div><div class="panel"><h2>${edit?'Edit event details':'Create a new event'}</h2><p class="descr">Give each event a unique code. Attendees can enter the code or choose an open event from their joining screen.</p><div class="event-form"><div class="field"><label>Event name *</label><input class="input" id="manage-event-name" maxlength="80" placeholder="e.g. Harmoniq Summer Live" value="${esc(edit?.name||'')}"></div><div class="field"><label>Event access code *</label><input class="input" id="manage-event-code" maxlength="16" placeholder="e.g. SUMMER26" value="${esc(edit?.code||'')}"></div><div class="field"><label>Venue / location</label><input class="input" id="manage-event-venue" maxlength="120" placeholder="e.g. Birmingham Demo Arena" value="${esc(edit?.venue||'')}"></div><div class="field"><label>Event date</label><input class="input" id="manage-event-date" type="date" value="${esc(edit?.date||'')}"></div><div class="field span-2"><label>Entry status</label><select class="input" id="manage-event-status"><option value="live" ${(!edit||edit.status==='live')?'selected':''}>Open — attendees can join</option><option value="draft" ${edit?.status==='draft'?'selected':''}>Draft — not joinable</option><option value="closed" ${edit?.status==='closed'?'selected':''}>Closed — entry disabled</option></select></div><div class="row span-2"><button class="btn" data-action="save-event">${edit?'Save event changes':'Create event →'}</button>${edit?'<button class="btn ghost" data-action="cancel-event-edit">Cancel editing</button>':''}</div></div><p class="event-help">New events start with zero audience members and votes. Every event has an independent light mode, poll, quiz and sponsor moment. All data is stored locally in this browser for demonstration only.</p></div>`;
}
function availableEventsForAudience(){return db.events.filter(e=>e.status==='live').map(e=>`<button class="event-lobby-card" data-join-code="${esc(e.code)}"><strong>${esc(e.name)}</strong><span>${esc(e.venue||'Demo venue')} · CODE ${esc(e.code)} →</span></button>`).join('')||'<div class="mini-label">No events are currently accepting attendees.</div>';}
function eventOptions(selected){return db.events.map(e=>`<option value="${esc(e.id)}" ${e.id===selected?'selected':''}>${esc(e.name)} (${esc(e.code)})</option>`).join('')}

function esc(str){return String(str??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function toast(s){const n=document.getElementById('toast');n.textContent=s;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),3000)}
function icon(name){const d={events:'▦',overview:'◫',lights:'✦',poll:'◉',quiz:'★',announcements:'◈',sponsors:'◆',rewards:'◇',analytics:'▥',future:'↗'};return d[name]||'◆'}
function currentLight(){if(state.lightMode==='sequence'&&state.lightStarted){let t=(Date.now()-state.lightStarted)/1000;if(t>=16)return {color:COLORS.violet,label:'Sequence complete',done:true};return {...sequence.filter(s=>t>=s.at).slice(-1)[0],progress:Math.round(t/16*100)};}return {color:state.color,label:state.lightMode==='solid'?'Single colour active':'Waiting for light show',done:false}}
function lightBanner(){let l=currentLight();return `<div class="lighting-stage" style="background:radial-gradient(ellipse at center,${l.color},#26173c 83%)"><div><span>${esc(l.label)}</span><strong>${state.lightMode==='sequence'&&!l.done?'AURORA WAVE':'LIGHT STUDIO'}</strong></div></div>`}
function qrMarkup(size=140){let squares='';let s=13;for(let y=0;y<s;y++)for(let x=0;x<s;x++){let corners=((x<4&&y<4)||(x>8&&y<4)||(x<4&&y>8));let on=corners?(x===0||x===3||y===0||y===3||(x===1&&y===1)||(x===10&&y===1)||(x===1&&y===10)):((x*13+y*17+x*y*7)%7<3);if(on)squares+=`<rect x="${x*8}" y="${y*8}" width="8" height="8" fill="#231b36"/>`;}return `<svg width="${size}" height="${size}" viewBox="0 0 104 104" aria-label="Decorative demo QR, not redeemable"><rect width="104" height="104" fill="white"/>${squares}</svg>`}
function statusPill(){return `<span class="pill live">● LIVE DEMO · ${state.attendees} connected</span>`}
function topbar(){return `<div class="topbar"><div class="topbar-brand"><div><div class="kicker">Harmoniq / Organiser</div><div class="crumb">${esc(event.name)} · Code ${esc(event.code)} · Interactive concept</div></div></div><div class="actions"><label class="event-switch-label">EVENT <select class="event-switch" id="organiser-event-switch">${eventOptions(organiserEventId)}</select></label>${statusPill()}<button class="btn ghost small-btn" data-action="open-audience">↗ Audience</button><button class="btn ghost small-btn" data-action="open-display">▣ Display</button><button class="btn secondary small-btn" data-action="open-hub">Explore</button><button class="btn ghost small-btn" data-action="reset-demo" title="Reset the currently selected event only">Reset event</button></div></div>`}
function sidebar(){let sections=[['EVENTS',['events']],['CONTROL',['overview','lights','poll','quiz','announcements']],['COMMERCIAL',['sponsors','rewards','analytics']],['ROADMAP',['future']]];return `<aside class="sidebar"><div class="brand"><span class="logo-mark">✦</span>HARMONIQ</div>${sections.map(([name,ls])=>`<div class="nav-label">${name}</div><div class="nav-group">${ls.map(k=>`<button class="nav-btn ${tab===k?'active':''}" data-tab="${k}"><span style="font-size:20px;width:20px">${icon(k)}</span>${({events:'All events',overview:'Overview',lights:'Light control',poll:'Live polls',quiz:'Quiz & trivia',announcements:'Announcements',sponsors:'Sponsor moments',rewards:'Rewards & offers',analytics:'Analytics',future:'Future features'})[k]}</button>`).join('')}</div>`).join('')}<div class="sidebar-foot"><span class="badge">CONCEPT / UK</span><p>Prototype with simulated analytics and shared browser-tab interactions.</p></div></aside>`}
function heading(k,t,sub){return `<div class="kicker">${k}</div><h1 class="hero-title">${t}</h1><p class="lead">${sub}</p>`}
function stat(v,label,sub){return `<div class="stat"><strong>${esc(v)}</strong><span>${esc(label)}</span><em>${esc(sub)}</em></div>`}
function organizerContent(){if(tab==='events')return eventsManagement();if(tab==='overview')return `${heading('Event control room','Make the crowd part of the show.','One live control centre for lights, audience engagement and commercial moments.')}<div class="grid-3" style="margin-bottom:22px">${stat(state.attendees,'Connected attendees','Selected event only')}${stat(totalVotes(),'Poll votes recorded','Selected event only')}${stat(state.lightLaunchCount,'Light shows launched','Selected event only')}</div><div class="panel"><h2>Launch an experience</h2><p class="descr">Select a live moment. Changes are mirrored into the audience preview and other same-origin browser tabs.</p><div class="module-grid">${[['lights','✦','Light experience','Control phone colours and sequences'],['poll','◉','Live polling','Let the crowd choose what comes next'],['quiz','★','Interactive trivia','Start a simple multiple-choice round'],['announcements','◈','Announcements','Send a message to connected users'],['sponsors','◆','Sponsor moment','Activate a branded takeover'],['analytics','▥','Engagement insights','Watch simulated pilot-level metrics']].map(([k,i,t,d])=>`<button class="module" data-tab="${k}"><div class="module-icon">${i}</div><b>${t}</b><p>${d}</p><span>Launch module →</span></button>`).join('')}</div></div>`;
if(tab==='lights')return `${heading('EXPERIENCE / LIGHTING','Light experience','Control the screen colour of attendees or launch a preloaded, clock-timed sequence.')}${lightBanner()}<div class="panel"><h2>Choose a crowd colour</h2><p class="descr">Solid mode changes the light display immediately. This is a prototype simulation.</p><div class="color-list">${Object.entries(COLORS).map(([key,color])=>`<button title="${key}" aria-label="Select ${key}" class="swatch ${state.color===color?'selected':''}" data-color="${key}" style="background:${color}"></button>`).join('')}</div><div class="row"><button class="btn" data-action="activate-solid">Apply selected colour →</button><button class="btn ghost" data-action="stop-light">Stop lighting</button></div></div><div class="panel"><h2>Preloaded sequences</h2><p class="descr">The Aurora Wave runs through four colours at 4-second intervals, based on a common start timestamp. Keep the audience view open to preview.</p><div class="scene-row"><div><strong>✦ Aurora Wave</strong><p>Violet → Pink → Teal → Gold · 16 seconds</p></div><button class="btn" data-action="start-sequence">▶ Launch</button></div><p class="tooltip">For pilot hardware, exact synchronization and offline reliability still require validation.</p></div>`;
if(tab==='poll')return `${heading('ENGAGEMENT / LIVE','Poll manager','Launch or close a live poll and watch audience responses appear as they are recorded.')}<div class="panel"><h2>Build a live question</h2><div class="field"><label>Poll question</label><input id="poll-question" class="input" maxlength="125" value="${esc(state.poll.question)}"></div><div class="option-editor">${state.poll.options.map((o,i)=>`<div class="field"><label>Option ${String.fromCharCode(65+i)}</label><input class="input" id="poll-option-${i}" value="${esc(o)}" maxlength="56" /></div>`).join('')}</div><div class="row"><button class="btn secondary" data-action="save-poll">Save question</button><button class="btn" data-action="launch-poll">${state.poll.open?'Restart polling':'Launch live poll'} →</button><button class="btn ghost" data-action="close-poll">Close poll</button></div><p class="tooltip">Launching starts a fresh round with zero votes. Preview shows initial example results until you launch.</p></div><div class="panel"><h2>Current results <span class="badge">${state.poll.open?'LIVE':'PREVIEW'}</span></h2>${pollBars()}<p class="small muted">${totalVotes()} votes · Demo data plus current interactions</p></div>`;
if(tab==='quiz')return `${heading('ENGAGEMENT / TRIVIA','Quiz & trivia','A simple live quiz with attendee feedback and demonstration scoring.')}<div class="panel"><div class="kicker">ROUND 01 / 03</div><h2 style="font-size:25px;margin-top:13px">${esc(state.quiz.question)}</h2>${state.quiz.options.map((o,i)=>`<div class="scene-row"><strong>${String.fromCharCode(65+i)}. ${esc(o)}</strong>${i===state.quiz.correct?'<span class="badge">Correct answer</span>':''}</div>`).join('')}<div class="row" style="margin-top:24px"><button class="btn" data-action="launch-quiz">Start trivia round →</button><button class="btn ghost" data-action="close-quiz">Close round</button></div><p class="tooltip">Participants can answer once per round in their browser session.</p></div>`;
if(tab==='announcements')return `${heading('OPERATIONS / MESSAGING','Announcements','Compose and broadcast a short message to connected audience screens.')}<div class="panel"><h2>Event announcement</h2><div class="field"><label>Message body</label><textarea class="input" id="announcement-body">${esc(state.announcement)}</textarea></div><div class="row"><button class="btn" data-action="send-announcement">Send announcement →</button><button class="btn ghost" data-action="clear-announcement">Clear banner</button></div>${state.announcementSent?`<div class="notice green" style="margin-top:16px">✓ Message visible on attendee screens. Delivery is simulated in-browser.</div>`:''}</div>`;
if(tab==='sponsors')return `${heading('COMMERCIAL / ACTIVATIONS','Sponsor moments','Launch a branded screen and connect an interactive offer to the event experience.')}<div class="panel"><div class="sponsor-panel" style="padding:48px 16px"><div class="kicker" style="color:#ffd4f3">PARTNER EXPERIENCE</div><b style="font-size:45px">NOVA AUDIO</b><span style="font-size:17px">BEYOND THE SOUND</span><p style="color:#fff">Your concert. Your moment.</p></div><div class="row"><button class="btn" data-action="launch-sponsor">Activate sponsor moment →</button><button class="btn ghost" data-action="close-sponsor">End sponsor moment</button></div><p class="tooltip">NOVA AUDIO is a fictional demo sponsor; no commercial inventory or brand contract is implied.</p></div>`;
if(tab==='rewards')return `${heading('COMMERCIAL / REWARDS','QR rewards & offers','Give participants a simple sponsor reward after an engagement moment.')}<div class="panel"><div style="display:flex;gap:25px;align-items:center;flex-wrap:wrap"><div class="qr-mini" style="box-sizing:content-box">${qrMarkup(140)}</div><div><div class="kicker">NOVA AUDIO / DEMO</div><h2>10% off event merchandise</h2><p class="muted small">Preview QR is decorative and not redeemable.</p><button class="btn secondary" data-action="activate-offer">Publish demo offer</button></div></div></div>`;
if(tab==='analytics')return `${heading('INSIGHTS / PILOT','Basic analytics','A preview of the event participation metrics available in the MVP.')}<div class="grid-3" style="margin-bottom:18px">${stat(state.attendees,'Connected users','Illustrative baseline')}${stat(totalVotes(),'Poll responses','Browser demo votes')}${stat(state.rewardCount,'Reward impressions','Illustrative baseline')}</div><div class="panel"><h2>Engagement over the event</h2><p class="descr">Representative chart, not measured usage telemetry.</p><div class="analytics-bars">${[18,26,39,57,45,72,66,86,73,99,80,110,103].map(v=>`<span style="height:${v}%"></span>`).join('')}</div><div class="mini-label">Event timeline →</div></div><div class="panel"><h2>Poll participation</h2>${pollBars()}</div>`;
return `${heading('ROADMAP / PREVIEW','Future capabilities','These screens are intentionally conceptual and excluded from the pilot-ready MVP.')}<div class="futures">${[['Venue map & seat guidance','Find your zone, row and seat.'],['Zone-based messaging','Target specific sections of a venue.'],['Sponsor analytics report','Campaign performance and redemption insights.'],['Smart modular displays','Future hardware-connected experience.'],['Venue rewards','Loyalty and commercial offers across venues.'],['Safety & first aid','Requires authorised venue operations and separate validation.']].map(([a,b])=>`<div class="future"><span class="tag">FUTURE / PREVIEW</span><b style="margin-top:15px">${a}</b><p>${b}</p></div>`).join('')}</div>`;
}
function totalVotes(){return state.poll.votes.reduce((a,b)=>a+b,0)}
function pollBars(){let sum=totalVotes();return state.poll.options.map((name,i)=>{const pct=sum?Math.round(state.poll.votes[i]/sum*100):0;return `<div class="result-item"><div class="result-head"><strong>${esc(name)}</strong><strong>${pct}%</strong></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div>`}).join('')}
function sponsorMobile(){return `<div class="sponsor-panel"><div style="font-size:11px;color:#ffd4f3;letter-spacing:2px">OFFICIAL MOMENT</div><b>NOVA AUDIO</b><span>BEYOND THE SOUND</span><p style="color:#fff">Your concert. Your moment.</p></div><button class="btn phone-action" data-mobile="reward">Unlock event reward →</button>`}
function phoneHtml(compact=true){if(!compact&&!joined){const preset=QS.get('event')||'NIGHT26';return `<div class="phone"><div class="phone-main"><div class="phone-header">HARMONIQ <span class="live-dot">●</span></div><div class="kicker">JOIN YOUR EVENT</div><h2>Find your moment.</h2><p>Each event has its own code, poll and lighting experience.</p><div class="field"><label>Enter event code</label><input class="input" id="event-code" placeholder="NIGHT26" value="${esc(preset)}" maxlength="16" /></div><button class="btn phone-action" data-action="join-event">Join event →</button><div class="event-lobby"><div class="eyebrow">OPEN EVENTS</div>${availableEventsForAudience()}</div></div></div>`;}
const back=`<button class="phone-back" data-mobile="home">← Back to event</button>`;let content='';let footer=true;
if(audiencePage==='home'){content=`<div class="phone-header">HARMONIQ <span class="live-dot">● LIVE</span></div><div class="eyebrow">${esc(event.name.toUpperCase())} · ${esc(event.code)}</div><h2>You're part of the show.</h2><p>Welcome to your live experience.</p>${state.announcementSent?`<button class="phone-banner" data-mobile="announcement" style="text-align:left;width:100%;color:white;border:1px solid #5e447c">📣 ${esc(state.announcement)}</button>`:''}${state.sponsorActive?`<button class="phone-banner" data-mobile="sponsor" style="text-align:left;width:100%;color:white;border:1px solid #5e447c">★ Sponsor moment is live — view offer →</button>`:''}<div class="festival-card"><span>● LIVE NOW</span><b>${esc(event.name.toUpperCase())}</b><p>${state.attendees} attendees connected</p></div><div class="phone-tile-grid"><button class="phone-tile" data-mobile="lights">✦<b>Light show</b><span>Join the colours</span></button><button class="phone-tile" data-mobile="poll">◉<b>Live poll</b><span>Vote for a song</span></button><button class="phone-tile" data-mobile="quiz">★<b>Trivia</b><span>Play & score</span></button><button class="phone-tile" data-mobile="sponsor">◆<b>Rewards</b><span>Sponsor offers</span></button><button class="phone-tile" data-mobile="announcement">◈<b>Updates</b><span>Organiser messages</span></button><button class="phone-tile" data-mobile="map">↗<b>Venue map</b><span>Future preview</span></button></div><div class="event-mini-row" style="margin-top:13px"><span class="mini-label">CODE ${esc(event.code)}</span><button data-action="leave-event">↔ Switch event</button></div>`}
if(audiencePage==='lights'){const l=currentLight();if(state.lightMode!=='idle'&&!l.done){footer=false;content=`<div class="light-full" style="background:${l.color}"><div class="light-brand">HARMONIQ · LIGHT EXPERIENCE</div><div style="text-align:center"><strong>${state.lightMode==='sequence'?'AURORA WAVE':'CROWD COLOUR'}</strong><p>${esc(l.label)}</p></div><button class="btn secondary" data-mobile="home">Exit light mode ×</button></div>`}else content=`${back}<div class="eyebrow">LIVE LIGHT EXPERIENCE</div><h2>Light up the crowd.</h2><p>Wait for the organiser to launch a sequence. Keep this screen open.</p><div class="lighting-stage" style="height:235px;margin-top:40px"><div><span>STANDBY</span><strong>READY</strong></div></div><div class="notice">Light effects are simulated. Timed sequences are included in the page and use a shared start timestamp.</div>`}
if(audiencePage==='poll'){let already=sessionStorage.getItem('harmoniq-vote-'+event.id+'-'+state.poll.version)==='1';content=`${back}<div class="eyebrow">LIVE POLL ${state.poll.open?'● OPEN':'· PREVIEW'}</div><h2>${esc(state.poll.question)}</h2><p>Your voice shapes the show. Choose the next moment.</p>${already?`<div class="phone-result">✓ Vote submitted</div>${pollBars()}`:state.poll.open?state.poll.options.map((opt,i)=>`<button class="option" data-vote="${i}">${String.fromCharCode(65+i)} &nbsp; ${esc(opt)} →</button>`).join(''):'<div class="notice">Poll not started. Check back soon.</div>'}<div class="mini-label">${state.poll.open?'Votes appear in same-origin demo tabs for this event.':'Wait for the organiser to open this poll.'}</div>`}
if(audiencePage==='quiz'){let selection=sessionStorage.getItem('harmoniq-quiz-'+event.id+'-'+state.quiz.version);content=`${back}<div class="eyebrow">TRIVIA / ROUND 01</div><h2>${esc(state.quiz.question)}</h2><p>Choose one answer. Win 100 demo points.</p>${selection!==null?`<div class="score">${Number(selection)===state.quiz.correct?'+100':'0'}</div><p style="text-align:center">${Number(selection)===state.quiz.correct?'Correct! Nice one.':'Great try. The correct answer is '+esc(state.quiz.options[state.quiz.correct])+'.'}</p>`:state.quiz.open?state.quiz.options.map((opt,i)=>`<button class="option" data-quiz="${i}">${String.fromCharCode(65+i)} &nbsp; ${esc(opt)} →</button>`).join(''):'<div class="notice">Quiz starts when the organiser launches this round.</div>'}`}
if(audiencePage==='announcement')content=`${back}<div class="eyebrow">OFFICIAL ANNOUNCEMENT</div><h2>Stay in the moment.</h2><div class="phone-banner" style="font-size:16px;margin-top:45px;padding:21px">${esc(state.announcementSent?state.announcement:'No active announcement yet. Check back soon.')}</div><p>Messages are controlled by the organiser.</p>`;
if(audiencePage==='sponsor')content=`${back}<div class="eyebrow">SPONSOR EXPERIENCE</div><h2>A moment powered by a partner.</h2>${sponsorMobile()}`;
if(audiencePage==='reward')content=`${back}<div class="eyebrow">SPONSOR REWARD</div><h2>You've unlocked an offer.</h2><div style="background:#f6f2ff;color:#2e2444;border-radius:22px;padding:17px;margin-top:24px;text-align:center"><strong>NOVA AUDIO</strong><div class="reward-qr">${qrMarkup(128)}</div><b>10% off event merchandise</b><p style="color:#665d73">DEMO QR · NOT REDEEMABLE</p></div><button class="btn phone-action" data-mobile="home">Return to event →</button>`;
if(audiencePage==='map')content=`${back}<div class="eyebrow">FUTURE CONCEPT</div><h2>Venue guidance.</h2><p>Zone-based maps and seat finding are planned for future versions.</p><div style="padding:30px;background:repeating-linear-gradient(45deg,#251e3b 0,#251e3b 27px,#302646 28px,#302646 30px);border:1px solid #574571;border-radius:20px;margin-top:35px;text-align:center;height:250px;display:grid;place-items:center"><div class="badge">ZONE A1 · PREVIEW ONLY</div></div>`;
return `<div class="phone ${!footer?'full-light':''}"><div class="phone-main">${content}</div>${footer?`<div class="phone-footer">${[['home','Home'],['lights','Lights'],['poll','Poll'],['sponsor','Offers']].map(([k,name])=>`<button class="${audiencePage===k?'selected':''}" data-mobile="${k}">${name}</button>`).join('')}</div>`:''}</div>`}
function studio(){return `<div class="debug-banner">INTERACTIVE CONCEPT DEMO · BROWSER SIMULATION · NOT PRODUCTION SOFTWARE</div><div class="shell">${sidebar()}<main class="main">${topbar()}<div class="layout"><section class="workspace">${organizerContent()}</section><aside class="preview-column"><div class="preview-cap"><div><div class="kicker">LIVE AUDIENCE PREVIEW</div><p class="small muted" style="margin:8px 0 0">Phone screen mirrored in-browser</p></div><button class="btn ghost small-btn" data-action="open-audience">↗</button></div>${phoneHtml()}</aside></div></main></div>`}
function attendee(){return `<div class="debug-banner">HARMONIQ ATTENDEE DEMO · MULTI-EVENT ACCESS</div><div style="min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 50% 10%,#34224f,#0b0919 65%)"><div style="position:fixed;top:25px;left:30px"><button class="btn ghost small-btn" data-action="open-hub">← Explore product</button></div>${phoneHtml(false)}</div>`}
function display(){const l=currentLight();let body='';if(stageMode==='poll'&&state.poll.open){body=`<h1>${esc(state.poll.question)}</h1><div class="display-poll">${pollBars()}</div><p>${totalVotes()} votes for ${esc(event.name)} · Demo mode</p>`}else if(state.sponsorActive){body=`<div class="display-sponsor"><div class="kicker" style="color:#ffd9f4">SPONSOR MOMENT</div><h1>NOVA AUDIO</h1><h2 class="sub">BEYOND THE SOUND</h2><p style="color:white">Your concert. Your moment.</p></div>`}else if(state.lightMode!=='idle'&&!l.done){body=`<div class="display-light" style="background:${l.color}"><strong>AURORA WAVE</strong></div><p>Everyone, light up the room.</p>`}else if(state.poll.open||stageMode==='poll'){body=`<h1>${esc(state.poll.question)}</h1><div class="display-poll">${pollBars()}</div><p>${totalVotes()} votes in demo mode · Vote with your phone</p>`}else if(state.announcementSent){body=`<h1>MESSAGE FROM THE ORGANISER</h1><p style="color:white;font-size:38px;max-width:980px">${esc(state.announcement)}</p>`}else{body=`<div class="kicker">WELCOME TO THE SHOW</div><h1>YOU ARE<br/>THE SHOW.</h1><p>Join this event on your phone using code <strong style="color:white">${esc(event.code)}</strong></p><div style="display:flex;gap:16px;margin-top:38px;align-items:center"><div style="background:white;padding:10px;border-radius:12px">${qrMarkup(120)}</div><p>Scan-style graphic for presentation only.<br/>Use the event code to enter the demo.</p></div>`}return `<div class="display-screen"><div class="display-header"><div class="brand"><span class="logo-mark">✦</span>HARMONIQ <span class="kicker" style="font-size:12px;margin-left:10px">LIVE DISPLAY · ${esc(event.name.toUpperCase())}</span></div><div class="actions"><label class="event-switch-label">EVENT <select id="display-event-switch" class="event-switch">${eventOptions(displayEventId)}</select></label><span class="pill live">● ${state.attendees} demo viewers</span><button class="btn ghost small-btn" data-action="set-display-poll">Poll results</button><button class="btn secondary small-btn" data-action="open-hub">Explore</button><button class="btn ghost small-btn" data-action="fullscreen">⛶</button></div></div><div class="display-stage">${body}</div><p style="position:fixed;bottom:17px;right:24px;font-size:11px;color:#716984">HARMONIQ CONCEPT / PRESENTATION MODE</p></div>`}
function hub(){return `<div class="landing"><div class="brand"><span class="logo-mark">✦</span>HARMONIQ</div><div class="kicker" style="margin-top:16px">INTERACTIVE PRODUCT PROTOTYPE · UK PILOT CONCEPT</div><h1>Make the crowd<br/><i>part of the show.</i></h1><p class="landing-sub">One connected experience across an organiser control room, attendee phones and a live venue display.</p><div class="landing-grid">${[['01','Attendee experience','Join an event, light up the phone, take part in a poll and unlock a reward.','attendee'],['02','Organiser control room','Run interactive moments, control crowd lights and explore basic analytics.','studio'],['03','Live venue display','Show an audience-driven moment on the big screen.','display']].map(([n,title,sub,v])=>`<button class="landing-card" data-view="${v}"><div class="kicker">${n} / EXPLORE</div><b>${title}</b><p>${sub}</p><em>Open experience →</em></button>`).join('')}</div><div class="notice" style="max-width:930px">Concept demonstration only. Browser controls simulate real-time interactions; no cloud backend, authentication, real event service or production sync is provided.</div></div>`}
function draw(){refreshActive();const a=document.getElementById('app');a.innerHTML=view==='studio'?studio():view==='attendee'?attendee():view==='display'?display():hub();document.title='Harmoniq — '+({studio:'Organiser Control Room',attendee:'Attendee Experience',display:'Live Display',hub:'Product Demo'})[view]}
function nav(v){view=v;if(v==='attendee')joined=Boolean(attendeeEventId&&sessionStorage.getItem('hm-joined-current')===attendeeEventId);draw();try{history.replaceState(null,'',location.pathname+'?view='+encodeURIComponent(v))}catch(e){}window.scrollTo(0,0)}
function enterMobile(s){audiencePage=s;draw()}
function openView(v){window.open(location.pathname+'?view='+v+'&event='+encodeURIComponent(event.code),'_blank','noopener,noreferrer')}
function handleAction(action){switch(action){
case'open-hub':nav('hub');break;
case'open-audience':openView('attendee');break;
case'open-display':openView('display');break;
case'join-event':joinEventByCode(document.getElementById('event-code')?.value);break;
case'leave-event':leaveEvent();break;
case'cancel-event-edit':editingEventId=null;draw();break;
case'save-event':{
 const name=document.getElementById('manage-event-name')?.value.trim();
 const code=document.getElementById('manage-event-code')?.value.trim().toUpperCase();
 const venue=document.getElementById('manage-event-venue')?.value.trim()||'';
 const date=document.getElementById('manage-event-date')?.value||'';
 const status=document.getElementById('manage-event-status')?.value||'live';
 if(!name||name.length<3){toast('Enter an event name of at least 3 characters.');return}
 if(!/^[A-Z0-9-]{4,16}$/.test(code||'')){toast('Use a code of 4–16 letters, numbers or hyphens.');return}
 if(db.events.some(e=>e.code===code&&e.id!==editingEventId)){toast('This event code already exists.');return}
 const nextId=editingEventId||'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
 updateDatabase(d=>{const item=d.events.find(e=>e.id===nextId);if(item){Object.assign(item,{name,code,venue,date,status});item.state.eventName=name.toUpperCase();}else{d.events.push({id:nextId,code,name,venue,date,status,category:'Event',state:newEventState(name)})}});
 editingEventId=null;selectOrganiser(nextId);tab='events';draw();toast('Event saved: '+name);break;}
case'activate-solid':update(s=>{s.lightMode='solid';s.lightStarted=0});toast('Crowd colour activated for '+event.name);break;
case'start-sequence':update(s=>{s.lightMode='sequence';s.lightStarted=Date.now()+900;s.lightLaunchCount++});toast('Aurora Wave scheduled for '+event.name);break;
case'stop-light':update(s=>{s.lightMode='idle';s.lightStarted=0});toast('Light show stopped');break;
case'save-poll':{const q=document.getElementById('poll-question')?.value.trim();const opts=[0,1,2].map(i=>document.getElementById('poll-option-'+i)?.value.trim());if(!q||opts.some(a=>!a)){toast('Question and all three options are required.');return;}update(s=>{s.poll.question=q;s.poll.options=opts});toast('Poll question saved for '+event.name);break}
case'launch-poll':{const q=document.getElementById('poll-question')?.value.trim()||state.poll.question,opts=[0,1,2].map(i=>document.getElementById('poll-option-'+i)?.value.trim()||state.poll.options[i]);update(s=>{s.poll={question:q,options:opts,votes:[0,0,0],open:true,version:s.poll.version+1};s.sponsorActive=false});stageMode='poll';toast('Live poll launched for '+event.name);break}
case'close-poll':update(s=>{s.poll.open=false});toast('Poll closed');break;
case'launch-quiz':update(s=>{s.quiz.open=true;s.quiz.version++});toast('Trivia round is live');break;
case'close-quiz':update(s=>{s.quiz.open=false});toast('Trivia round closed');break;
case'send-announcement':{const message=document.getElementById('announcement-body')?.value.trim();if(!message){toast('Please write an announcement.');return;}update(s=>{s.announcement=message;s.announcementSent=true});toast('Announcement sent for '+event.name);break}
case'clear-announcement':update(s=>s.announcementSent=false);toast('Announcement cleared');break;
case'launch-sponsor':update(s=>s.sponsorActive=true);toast('Sponsor moment active');break;
case'close-sponsor':update(s=>s.sponsorActive=false);toast('Sponsor moment ended');break;
case'activate-offer':update(s=>s.sponsorActive=true);toast('Demo reward published');break;
case'set-display-poll':stageMode='poll';draw();break;
case'fullscreen':{const e=document.documentElement;if(!document.fullscreenElement){e.requestFullscreen?.()}else{document.exitFullscreen?.()}break}
case'reset-demo':{update(s=>Object.assign(s,newEventState(event.name,event.id==='evt-midnight')));toast('Selected event reset: '+event.name);break;}
}}
window.addEventListener('click',e=>{
const a=e.target.closest('[data-action],[data-tab],[data-mobile],[data-vote],[data-quiz],[data-color],[data-view],[data-join-code],[data-select-event],[data-edit-event],[data-toggle-event]');if(!a)return;
if(a.dataset.action){handleAction(a.dataset.action);return}
if(a.dataset.joinCode){joinEventByCode(a.dataset.joinCode);return}
if(a.dataset.selectEvent){selectOrganiser(a.dataset.selectEvent);tab='overview';draw();return}
if(a.dataset.editEvent){editingEventId=a.dataset.editEvent;tab='events';draw();setTimeout(()=>document.getElementById('manage-event-name')?.focus(),50);return}
if(a.dataset.toggleEvent){const id=a.dataset.toggleEvent;updateDatabase(d=>{const e=d.events.find(e=>e.id===id);if(e)e.status=e.status==='live'?'draft':'live';});toast('Event entry status changed');return}
if(a.dataset.tab){tab=a.dataset.tab;draw();return}
if(a.dataset.mobile){enterMobile(a.dataset.mobile);return}
if(a.dataset.view){nav(a.dataset.view);return}
if(a.dataset.color){update(s=>s.color=COLORS[a.dataset.color]);return}
if(a.dataset.vote){if(!joined&&view==='attendee'){toast('Join an event before voting.');return;}if(!state.poll.open){toast('Poll is not open yet.');return;}const token='harmoniq-vote-'+event.id+'-'+state.poll.version;if(sessionStorage.getItem(token)==='1'){toast('You already voted in this round.');return;}let i=Number(a.dataset.vote);sessionStorage.setItem(token,'1');update(s=>s.poll.votes[i]++);toast('Vote recorded for '+event.name);return}
if(a.dataset.quiz){if(!joined&&view==='attendee'){toast('Join an event before playing.');return;}if(!state.quiz.open){toast('The quiz has not started yet.');return;}const token='harmoniq-quiz-'+event.id+'-'+state.quiz.version;if(sessionStorage.getItem(token)!=null)return;sessionStorage.setItem(token,a.dataset.quiz);draw();toast(Number(a.dataset.quiz)===state.quiz.correct?'Correct answer! +100 demo points':'Thanks for taking part!');return}
});
window.addEventListener('change',e=>{if(e.target.id==='organiser-event-switch'){selectOrganiser(e.target.value);return}if(e.target.id==='display-event-switch'){selectDisplay(e.target.value);return}});

setInterval(()=>{if(state.lightMode==='sequence'){if(currentLight().done){update(s=>{if(s.lightMode==='sequence'&&(Date.now()-s.lightStarted)>=16000){s.lightMode='idle';s.lightStarted=0}})}else if(view==='display'||(view==='attendee'&&audiencePage==='lights')||(view==='studio'&&(tab==='lights'||audiencePage==='lights')))draw()}},900);
draw();
})();
</script>
</body>
</html>
